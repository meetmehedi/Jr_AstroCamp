[project]
name = "nasa-mission-simulator"
version = "1.0.0"
description = "NASA Mission Flight Simulator: 76 Historical Playable Missions in Pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
